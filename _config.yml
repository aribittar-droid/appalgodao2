# GitHub Pages Configuration
title: Sistema de Mapeamento do Algodão
description: Sistema PWA para mapeamento de estruturas reprodutivas do algodoeiro - Metodologia IMAmt
url: "https://USERNAME.github.io"
baseurl: "/REPOSITORY_NAME"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# PWA settings
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - README.md
  - .github/
  - node_modules/
  - Gemfile
  - Gemfile.lock

# Include files
include:
  - _headers
  - .well-known

# Security headers (if supported)
headers:
  - pattern: "/*"
    headers:
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
