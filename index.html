<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sistema de mapeamento de estruturas reprodutivas do algodão baseado na metodologia IMAmt">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Algodão Map">
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23059669' rx='6'/><rect x='6' y='6' width='20' height='20' fill='white' rx='3'/></svg>">
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23059669' rx='40'/><rect x='30' y='30' width='120' height='120' fill='white' rx='15'/><circle cx='90' cy='90' r='20' fill='%23059669'/></svg>">
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <title>Sistema de Mapeamento do Algodão</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>

  <style>
    /* Custom styles for PWA */
    @media (display-mode: standalone) {
      body {
        /* Remove any browser chrome styling */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      
      /* Safe area for iPhone notch */
      .safe-area-inset {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
    
    /* Loading animation */
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #059669;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Prevent zoom on input focus (iOS) */
    input, select, textarea {
      font-size: 16px !important;
    }
    
    /* Hide default focus outline and add custom */
    button:focus, input:focus {
      outline: 2px solid #10b981;
      outline-offset: 2px;
    }
    
    /* Touch-friendly minimum sizes */
    button, .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body>
  <!-- PWA Install Banner -->
  <div id="install-banner" class="hidden bg-green-600 text-white p-4 text-center">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div class="flex items-center">
        <svg class="h-6 w-6 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
        </svg>
        <span class="text-sm">Instalar app</span>
      </div>
      <div class="space-x-2">
        <button id="install-button" class="bg-white text-green-600 px-3 py-1 rounded text-sm font-medium">
          Instalar
        </button>
        <button id="dismiss-banner" class="text-green-200 hover:text-white">
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 bg-green-600 flex items-center justify-center z-50">
    <div class="text-center text-white">
      <div class="loading-spinner mx-auto mb-4"></div>
      <h2 class="text-2xl font-bold mb-2">Algodão Map</h2>
      <p class="text-green-200">Carregando sistema...</p>
    </div>
  </div>

  <!-- App Container -->
  <div id="app" class="hidden"></div>

  <!-- iOS Installation Instructions -->
  <div id="ios-install-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6">
      <div class="text-center">
        <div class="text-6xl mb-4">📱</div>
        <h3 class="text-xl font-bold mb-4">Instalar no iPhone/iPad</h3>
        <div class="text-left space-y-3 text-gray-700">
          <div class="flex items-start">
            <span class="bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm mr-3 mt-0.5">1</span>
            <p>Toque no botão <strong>Compartilhar</strong> no Safari 
               <svg class="inline w-4 h-4 mx-1" fill="currentColor" viewBox="0 0 20 20">
                 <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"/>
               </svg>
            </p>
          </div>
          <div class="flex items-start">
            <span class="bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm mr-3 mt-0.5">2</span>
            <p>Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong></p>
          </div>
          <div class="flex items-start">
            <span class="bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm mr-3 mt-0.5">3</span>
            <p>Toque em <strong>"Adicionar"</strong> para confirmar</p>
          </div>
        </div>
        <button id="close-ios-modal" class="w-full bg-green-600 text-white py-3 rounded-lg mt-6 font-semibold">
          Entendi
        </button>
      </div>
    </div>
  </div>

  <script type="text/babel" src="cotton_mapping_pwa.jsx"></script>
  
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const { 
      Grid, Settings, TrendingUp, Info, Smartphone, Wifi, WifiOff,
      Calculator, Download, Upload, Trash2, FileText, Layers, Book
    } = lucideReact;

    // Use the imported CottonMappingSystem component
    const App = () => {
    // Load the main app directly after component loads
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
      }, 1500);
    });

    // Use the CottonMappingSystem component directly
    ReactDOM.render(React.createElement(CottonMappingSystem), document.getElementById('app'));
  </script>

  <script>
    // PWA Installation Logic
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.remove('hidden');
    });

    document.getElementById('install-button').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-banner').classList.add('hidden');
        }
        deferredPrompt = null;
      } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        // Show iOS installation instructions
        document.getElementById('ios-install-modal').classList.remove('hidden');
        document.getElementById('ios-install-modal').classList.add('flex');
      }
    });

    document.getElementById('dismiss-banner').addEventListener('click', () => {
      document.getElementById('install-banner').classList.add('hidden');
    });

    document.getElementById('close-ios-modal').addEventListener('click', () => {
      document.getElementById('ios-install-modal').classList.add('hidden');
      document.getElementById('ios-install-modal').classList.remove('flex');
    });

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }

    // iOS specific features
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      // Prevent bounce scrolling
      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('input, textarea, select')) return;
        e.preventDefault();
      }, { passive: false });

      // Handle safe areas
      document.documentElement.style.setProperty('--safe-area-inset-top', 'env(safe-area-inset-top)');
      document.documentElement.style.setProperty('--safe-area-inset-bottom', 'env(safe-area-inset-bottom)');
    }

    // App installed detection
    window.addEventListener('appinstalled', () => {
      console.log('PWA foi instalado!');
      document.getElementById('install-banner').classList.add('hidden');
    });

    // Network status
    window.addEventListener('online', () => {
      console.log('Online');
    });

    window.addEventListener('offline', () => {
      console.log('Offline - PWA mode');
    });
  </script>
</body>
</html>
